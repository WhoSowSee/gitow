[package]
name = "gitow"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Open Git remotes and repository pages in your browser from the CLI"
repository = "https://github.com/WhoSowSee/gitow"
homepage = "https://github.com/WhoSowSee/gitow"
documentation = "https://docs.rs/gitow"
readme = "README.md"
keywords = ["git", "cli", "browser", "repository", "remote"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README-RU.md",
    "/assets/icon.svg",
    "/src/**",
    "/tests/**",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
